[project]
name = "omada-controller-mcp"
version = "0.1.0"
description = "MCP server + typed Python SDK for a TP-Link Omada SDN controller's Open API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "samhaque", email = "13789262+samhaque@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "attrs>=26.1.0",
    "fastmcp>=4.0.5",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0.post0",
    "typing-extensions>=4.16.0",
]

[project.scripts]
omada-mcp = "omada_mcp.server:main"

[dependency-groups]
dev = ["ruff>=0.16.8", "pytest>=8.4.0"]

[tool.uv.build-backend]
module-name = ["omada_client", "omada_auth", "omada_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/omada_client"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
